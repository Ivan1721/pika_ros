# Controladores ros2_control del Piper + gripper Pika en Gazebo.
# Mando por posicion directa (sin trayectorias): piper_IK.py ya interpola
# y publica pasos pequenos, igual que hace con el driver CAN real.
controller_manager:
  ros__parameters:
    update_rate: 200  # Hz, misma tasa a la que el driver real publica feedback

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: position_controllers/JointGroupPositionController

    gripper_controller:
      type: position_controllers/JointGroupPositionController

# use_local_topics: el estado sale por /joint_state_broadcaster/joint_states
# y no por /joint_states, que en la cadena de teleop es la salida de piper_IK.py.
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6

gripper_controller:
  ros__parameters:
    joints:
      - pika_jaw_left_joint
      - pika_jaw_right_joint
